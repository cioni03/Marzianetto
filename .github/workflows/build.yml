name: Build desktop packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Crea DMG
        run: bash scripts/package-macos.sh
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: marzianetto-macos
          path: dist/macos/*/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Crea ZIP ed eseguibile
        run: ./scripts/package-windows.ps1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: marzianetto-windows
          path: dist/windows/*/*.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Installa librerie Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl file patchelf desktop-file-utils libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Crea AppImage
        run: bash scripts/package-linux.sh
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: marzianetto-linux
          path: dist/linux/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Determina la versione della Release
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = os.environ['REF_NAME'] if os.environ['REF_TYPE'] == 'tag' else f'v{version}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: marzianetto-macos
          path: release-assets/macos
      - uses: actions/download-artifact@v4
        with:
          name: marzianetto-windows
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: marzianetto-linux
          path: release-assets/linux
      - name: Verifica tutti e tre i pacchetti
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for platform, extension in [('macos', '*.dmg'), ('windows', '*.zip'), ('linux', '*.AppImage')]:
              packages = list((Path('release-assets') / platform).rglob(extension))
              if len(packages) != 1:
                  raise SystemExit(f'{platform}: atteso un pacchetto, trovati {len(packages)}')
              print(packages[0])
          PY
      - name: Aggiorna il tag della versione automatica
        if: github.ref_type != 'tag'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = `tags/${process.env.RELEASE_TAG}`;
            let tagExists = true;
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              tagExists = false;
            }

            if (tagExists) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref,
                sha: context.sha,
                force: true,
              });
            } else {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/${ref}`,
                sha: context.sha,
              });
            }
      - name: Pubblica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: marzianetto ${{ steps.version.outputs.tag }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/macos/**/*.dmg
            release-assets/windows/**/*.zip
            release-assets/linux/**/*.AppImage
      - name: Rimuovi il precedente archivio Linux dalla Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner, repo, tag: process.env.RELEASE_TAG,
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id,
            });
            for (const asset of assets) {
              if (asset.name === 'marzianetto-linux-x86_64.tar.gz') {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }
