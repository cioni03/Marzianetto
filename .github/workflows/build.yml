name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nuova versione (es. 0.1.1 o v0.1.1)'
        required: true
        type: string

run-name: Build e release ${{ inputs.version }}

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Verifica la versione di release
        uses: actions/github-script@v7
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        with:
          script: |
            const version = process.env.REQUESTED_VERSION.trim().replace(/^v/, '');
            const pattern = /^(?:0|[1-9][0-9]{0,9})(?:\.(?:0|[1-9][0-9]{0,9})){2}$/;
            if (!pattern.test(version)) {
              core.setFailed('Usa una versione stabile X.Y.Z, ad esempio 0.1.1.');
              return;
            }
            const tag = `v${version}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              core.setFailed(`Il tag ${tag} esiste già. Scegli una versione nuova.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // Un rilascio manuale non deve far tornare indietro il canale di aggiornamento.
            const releases = github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const input = version.split('.').map(Number);
            for await (const { data } of releases) {
              for (const release of data) {
                if (release.draft || release.prerelease || !release.tag_name.startsWith('v')) continue;
                const existing = release.tag_name.slice(1);
                if (!pattern.test(existing)) continue;
                const parts = existing.split('.').map(Number);
                const difference = input.map((part, index) => part - parts[index]).find(n => n !== 0) ?? 0;
                if (difference <= 0) {
                  core.setFailed(`La versione deve essere superiore a ${release.tag_name}.`);
                  return;
                }
              }
            }
            core.setOutput('version', version);
            core.setOutput('tag', tag);

  macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica la versione alla build
        run: python3 scripts/set-release-version.py
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Crea DMG e ZIP di aggiornamento
        run: bash scripts/package-macos.sh
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: marzianetto-macos
          path: |
            dist/macos/*/*.dmg
            dist/macos/*/*.app.zip
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica la versione alla build
        run: python scripts/set-release-version.py
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Crea ZIP ed eseguibile
        run: ./scripts/package-windows.ps1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: marzianetto-windows
          path: dist/windows/*/*.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Applica la versione alla build
        run: python3 scripts/set-release-version.py
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      - name: Installa librerie Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl file patchelf desktop-file-utils libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Crea AppImage
        run: bash scripts/package-linux.sh
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: marzianetto-linux
          path: dist/linux/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [validate, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marzianetto-macos
          path: release-assets/macos
      - uses: actions/download-artifact@v4
        with:
          name: marzianetto-windows
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: marzianetto-linux
          path: release-assets/linux
      - name: Verifica tutti e tre i pacchetti
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for platform, extension in [('macos', '*.dmg'), ('macos', '*.app.zip'), ('windows', '*.zip'), ('linux', '*.AppImage')]:
              packages = list((Path('release-assets') / platform).rglob(extension))
              if len(packages) != 1:
                  raise SystemExit(f'{platform}: atteso un pacchetto, trovati {len(packages)}')
              print(packages[0])
          PY
      - name: Carica i pacchetti nella bozza di release
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: marzianetto ${{ needs.validate.outputs.tag }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release-assets/macos/**/*.dmg
            release-assets/macos/**/*.app.zip
            release-assets/windows/**/*.zip
            release-assets/linux/**/*.AppImage
      - name: Pubblica la release completa
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            });
