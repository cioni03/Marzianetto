name: Build desktop packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Crea DMG
        run: bash scripts/package-macos.sh
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: marzianetto-macos
          path: dist/macos/*/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Crea ZIP ed eseguibile
        run: ./scripts/package-windows.ps1
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: marzianetto-windows
          path: dist/windows/*/*.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installa librerie Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Compila e prepara archivio
        run: |
          cargo build --locked --release
          mkdir -p dist/linux
          cp target/release/marzianetto dist/linux/
          cp README.md README.en.md BUILDING.md dist/linux/
          tar -czf dist/linux/marzianetto-linux-x86_64.tar.gz -C dist/linux marzianetto README.md README.en.md BUILDING.md
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: marzianetto-linux
          path: dist/linux/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marzianetto-macos
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: marzianetto-windows
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: marzianetto-linux
          path: release-assets
      - name: Aggiorna il tag della build più recente
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: 'tags/latest',
                sha: context.sha,
                force: true,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/tags/latest',
                sha: context.sha,
              });
            }
      - name: Pubblica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: marzianetto — Latest build
          make_latest: true
          overwrite_files: true
          files: release-assets/*
