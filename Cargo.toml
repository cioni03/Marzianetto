[package]
name = "marzianetto"
version = "0.1.0"
edition = "2021"
description = "Compressore desktop di immagini multipiattaforma"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif", "bmp", "gif", "tiff"] }
percent-encoding = "2"
regex = "1"
rfd = "0.15"
scraper = "0.29"
ureq = { version = "3", features = ["gzip", "brotli"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"
webp = "0.3"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
strip = true
